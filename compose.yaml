
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: enterprise-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: enterprise_ai
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: enterprise_ai

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U enterprise_ai -d enterprise_ai
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
